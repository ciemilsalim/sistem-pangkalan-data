<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer Hexagon Orbit -->
    <polygon 
        points="50,5 90,25 90,75 50,95 10,75 10,25" 
        stroke="url(#emblemGradientCyan)" 
        stroke-width="6" 
        stroke-dasharray="18, 12" 
        fill="none"
    />
    
    <!-- Inner Hologram Core -->
    <polygon 
        points="50,22 75,36 75,64 50,78 25,64 25,36" 
        fill="url(#emblemGradientIndigo)" 
        fill-opacity="0.8"
        stroke="#06b6d4" 
        stroke-width="3"
    />

    <!-- Glowing Core Dot -->
    <circle cx="50" cy="50" r="14" fill="#06b6d4" fill-opacity="1" />
    <circle cx="50" cy="50" r="6" fill="#ffffff" fill-opacity="1" />
    
    <!-- Connection Node Beams -->
    <line x1="50" y1="5" x2="50" y2="40" stroke="#6366f1" stroke-width="3" stroke-dasharray="3, 3" />
    <line x1="10" y1="75" x2="38" y2="58" stroke="#6366f1" stroke-width="3" stroke-dasharray="3, 3" />
    <line x1="90" y1="75" x2="62" y2="58" stroke="#6366f1" stroke-width="3" stroke-dasharray="3, 3" />

    <defs>
        <linearGradient id="emblemGradientCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="emblemGradientIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
        </linearGradient>
    </defs>
</svg>
